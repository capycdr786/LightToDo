name: Build and Release APK

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version Tag
        id: get_version
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          VERSION="${BRANCH_NAME#release/}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for version: $VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk LightToDo-${{ steps.get_version.outputs.tag }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: LightToDo ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          files: LightToDo-${{ steps.get_version.outputs.tag }}.apk
          body: |
            ### Notes:
            - Initial release of LightToDo (v1.0.0)
            - Clean, minimalist offline-first task tracker built with Jetpack Compose & Material 3
            - Local JSON backup & restore functionality
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
